<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1D4686; --navy-esc:#122c54; --laranja:#E37835; --laranja-esc:#c25f21;
  --papel:#F2F4F7; --linha:#dfe3ea; --texto:#12203a; --suave:#6b7590;
  --verde:#1f8a5b; --erro:#c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Quicksand',system-ui,sans-serif;
  background:var(--papel);color:var(--texto);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100dvh;
}
button,input,select{font-family:inherit;font-size:16px}
button{cursor:pointer;border:0}
.oculto{display:none !important}

header{
  background:var(--navy);color:#fff;
  padding:18px 18px 20px;
  padding-top:calc(26px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:14px;
}
header img{height:42px;width:auto;display:block;background:#fff;border-radius:10px;padding:5px 10px}
header .tit{font-weight:700;font-size:26px;letter-spacing:-.02em}
header .barra{width:1px;height:30px;background:rgba(255,255,255,.3)}

nav{display:flex;background:var(--navy-esc);position:sticky;top:0;z-index:40}
nav button{
  flex:1;background:none;color:#a3b1cc;padding:14px 8px;
  font-size:15.5px;font-weight:600;border-bottom:3px solid transparent;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
nav button.ativo{color:#fff;border-bottom-color:var(--laranja)}
.selo{
  background:var(--laranja);color:#fff;font-family:'Poppins';font-weight:700;
  font-size:11px;min-width:20px;height:20px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 6px;
}

main{flex:1;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.painel{display:none}
.painel.ativo{display:block}

.cartao{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:18px}

label{
  display:block;font-size:12.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--suave);margin-bottom:7px;font-size:12.5px;
}
.campo{margin-bottom:18px}
input[type=text]{
  width:100%;padding:16px;font-size:17px;border:1.5px solid var(--linha);border-radius:13px;
  background:#fff;color:var(--texto);outline:none;font-weight:500;
}
input[type=text]:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(29,70,134,.13)}
#preco{font-family:'Poppins';font-weight:700;font-size:29px;padding:14px 16px;letter-spacing:-.01em}
#preco::placeholder{font-weight:600;color:#c3cad8}

.lojas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lojas button{
  padding:14px 4px;border:1.5px solid var(--linha);background:#fff;border-radius:12px;
  font-size:14.5px;font-weight:700;color:var(--suave);
}
.lojas button.sel{background:var(--navy);border-color:var(--navy);color:#fff}

.seletor{position:relative}
.seletor-bt{
  width:100%;padding:16px;border:1.5px solid var(--linha);border-radius:13px;
  background:#fff;color:var(--texto);font-weight:600;font-size:17px;
  display:flex;align-items:center;gap:10px;text-align:left;
}
.seletor-bt .sigla{font-family:'Poppins';font-weight:700;color:var(--navy);min-width:38px}
.seletor-bt .desc{color:var(--suave);font-weight:500;font-size:15.5px;flex:1}
.seletor-bt .seta{color:#aeb6c6;font-size:12px;transition:transform .18s}
.seletor.aberto .seletor-bt{border-color:var(--navy);box-shadow:0 0 0 3px rgba(29,70,134,.13)}
.seletor.aberto .seletor-bt .seta{transform:rotate(180deg)}

.seletor.aberto{padding-bottom:var(--alturaLista,252px)}
.opcoes{
  display:none;position:absolute;left:0;right:0;top:62px;z-index:30;
  background:#fff;border:1.5px solid var(--linha);border-radius:13px;
  max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  box-shadow:0 14px 34px rgba(18,32,58,.18);
}
.seletor.aberto .opcoes{display:block}
.opcoes button{
  width:100%;background:#fff;padding:14px 16px;text-align:left;
  display:flex;align-items:center;gap:10px;font-size:16.5px;font-weight:500;
  color:var(--texto);border-bottom:1px solid #f1f3f7;
}
.opcoes button:last-child{border-bottom:0}
.opcoes button .sigla{font-family:'Poppins';font-weight:700;color:var(--navy);min-width:38px}
.opcoes button .desc{color:var(--suave);font-size:14px}
.opcoes button.sel{background:#eef2f9}
.opcoes button.sel .desc{color:var(--navy)}
.opcoes button:active{background:#e6ebf5}

.btn{
  width:100%;padding:18px;border-radius:14px;font-weight:700;font-size:18.5px;
  background:var(--laranja);color:#fff;
}
.btn:active{background:var(--laranja-esc)}
.btn:disabled{opacity:.4}
.btn.azul{background:var(--navy)}
.btn.azul:active{background:var(--navy-esc)}
.btn.fantasma{background:#fff;color:var(--navy);border:1.5px solid var(--linha);font-size:14px;padding:13px;width:auto}
.btn.perigo{background:#fff;color:var(--erro);border:1.5px solid #f0c8c2;font-size:14px;padding:13px;width:auto}

.grupo{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.grupo .btn{flex:1;min-width:0}

.titulo{
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--suave);margin:22px 0 10px;display:flex;align-items:center;gap:8px;
}
.titulo:first-child{margin-top:0}
.titulo em{font-style:normal;color:#aeb6c6;font-weight:600}

.item{
  background:#fff;border:1px solid var(--linha);border-left:4px solid var(--laranja);
  border-radius:12px;padding:14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;
}
.item.enviada{border-left-color:var(--verde);opacity:.62}
.item .txt{flex:1;min-width:0}
.item .nome{font-weight:600;font-size:17px;line-height:1.3}
.item .un{font-size:13px;color:var(--suave);font-weight:600;margin-top:3px}
.item .loja{display:inline-block;background:#eef2f9;color:var(--navy);border-radius:6px;
  padding:2px 7px;font-size:10.5px;font-weight:700;margin-right:6px;letter-spacing:.03em}
.item.enviada .loja{background:#eaf5ef;color:var(--verde)}
.item .preco{font-family:'Poppins';font-weight:700;font-size:22px;color:var(--laranja)}
.item.enviada .preco{color:var(--verde)}
.lixo{background:none;color:#bcc3d1;font-size:23px;padding:2px 4px;line-height:1}

.vazio{text-align:center;padding:56px 24px;color:var(--suave)}
.vazio strong{display:block;color:var(--texto);font-size:17px;margin-bottom:7px;font-weight:700}
.vazio span{font-size:14px;line-height:1.5}

.conexao{
  display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  color:rgba(255,255,255,.72);margin-left:auto;
}
.conexao .luz{width:8px;height:8px;border-radius:50%;background:#7d8aa5}
.conexao .luz.on{background:#4ade80}
.conexao .luz.off{background:#f8b471}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:100;
  background:var(--texto);color:#fff;padding:14px 22px;border-radius:999px;
  font-size:14.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.28);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.ver{opacity:1;transform:translateX(-50%) translateY(-8px)}
.toast.erro{background:var(--erro)}
.toast.ok{background:var(--verde)}
</style>
</head>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, addDoc, serverTimestamp, onSnapshot, query, limit
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

var app = initializeApp({
  apiKey: "AIzaSyCltD4TzYkrN6bMc4hmSF1vjC6_YFLHtZQ",
  authDomain: "placas-ledur.firebaseapp.com",
  projectId: "placas-ledur",
  storageBucket: "placas-ledur.firebasestorage.app",
  messagingSenderId: "518682216405",
  appId: "1:518682216405:web:7f5f114839449a05c39f5c"
});
var db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }),
  // rede de empresa costuma bloquear WebSocket; isso detecta e usa outro caminho
  experimentalAutoDetectLongPolling: true
});
var colPlacas = collection(db, 'placas');

// manda uma placa pro Firestore; o SDK guarda local e sincroniza sozinho
window.__enviarPlaca = function(p){
  return addDoc(colPlacas, {
    loja: p.loja,
    produto: p.produto,
    variacao: p.variacao || '',
    preco: p.preco,
    unidade: p.unidade,
    criadaEm: serverTimestamp()
  });
};

// luz do cabeçalho: estado da rede do aparelho
var servidorOk = false;

var jaTentou = false;

function pintarLuz(){
  var luz = document.getElementById('luz');
  var txt = document.getElementById('luzTxt');
  if(navigator.onLine && servidorOk){
    luz.className = 'luz on'; txt.textContent = 'conectado';
  } else if(!navigator.onLine){
    luz.className = 'luz off'; txt.textContent = 'sem internet';
  } else if(!jaTentou){
    luz.className = 'luz'; txt.textContent = 'conectando';
  } else {
    luz.className = 'luz off'; txt.textContent = 'sem sinal';
  }
}

// so acusa problema depois de dar tempo do servidor responder
setTimeout(function(){ jaTentou = true; pintarLuz(); }, 8000);

onSnapshot(query(colPlacas, limit(1)), function(snap){
  if(!snap.metadata.fromCache) servidorOk = true;
  pintarLuz();
}, function(){
  servidorOk = false;
  document.getElementById('luz').className = 'luz off';
  document.getElementById('luzTxt').textContent = 'erro';
});

window.addEventListener('online', pintarLuz);
window.addEventListener('offline', pintarLuz);
pintarLuz();
</script>

<script>
(function(){
'use strict';

var CHAVE = 'placas.celular.v1';
var CHAVE_LOJA = 'placas.loja.v1';
var LOJAS = ['MATRIZ','FILIAL 1','FILIAL 2'];
var UNIDADES = [
  ['UN','Unidade'], ['CX','Caixa'], ['PC','Pacote'],
  ['SC','Saco'], ['GF','Garrafa']
];

var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return [].slice.call(document.querySelectorAll(s)); };

var placas = [];
var unidadeSel = 'UN';
var lojaSel = 'MATRIZ';

/* ---------- armazenamento local ---------- */
function carregar(){
  try {
    var bruto = localStorage.getItem(CHAVE);
    placas = bruto ? JSON.parse(bruto) : [];
    if(!Array.isArray(placas)) placas = [];
  } catch(e){ placas = []; }
}
function salvar(){
  try { localStorage.setItem(CHAVE, JSON.stringify(placas)); } catch(e){}
}

/* ---------- utilidades ---------- */
function toast(msg, tipo){
  var t = $('#toast');
  t.textContent = msg;
  t.className = 'toast ver' + (tipo ? ' ' + tipo : '');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.className = 'toast'; }, 2400);
}

function paraNumero(v){
  if(v === null || v === undefined || v === '') return null;
  var s = String(v).trim().replace(/[^\d,.]/g,'');
  if(!s) return null;
  if(s.indexOf(',') >= 0){
    s = s.replace(/\./g,'').replace(',','.');
  } else {
    var p = s.split('.');
    s = (p.length === 2 && p[1].length <= 2) ? p.join('.') : p.join('');
  }
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function fmt(n){
  return n.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}

/* ---------- abas ---------- */
$$('nav button').forEach(function(b){
  b.addEventListener('click', function(){
    var aba = b.dataset.aba;
    $$('nav button').forEach(function(x){ x.classList.toggle('ativo', x === b); });
    $$('.painel').forEach(function(p){ p.classList.toggle('ativo', p.id === 'p-' + aba); });
  });
});

/* ---------- lojas ---------- */
$('#lojas').innerHTML = LOJAS.map(function(l){
  return '<button type="button" data-loja="' + l + '">' + l + '</button>';
}).join('');

function definirLoja(l){
  lojaSel = l;
  $$('#lojas button').forEach(function(b){ b.classList.toggle('sel', b.dataset.loja === l); });
  try { localStorage.setItem(CHAVE_LOJA, l); } catch(e){}
}

$('#lojas').addEventListener('click', function(e){
  var b = e.target.closest('[data-loja]');
  if(b) definirLoja(b.dataset.loja);
});

/* ---------- unidades ---------- */
$('#opcoes').innerHTML = UNIDADES.map(function(u){
  return '<button type="button" data-un="' + u[0] + '">' +
         '<span class="sigla">' + u[0] + '</span>' +
         '<span class="desc">' + u[1] + '</span></button>';
}).join('');

function definirUnidade(un){
  unidadeSel = un;
  var achou = UNIDADES.filter(function(u){ return u[0] === un; })[0] || UNIDADES[0];
  $('#unSigla').textContent = achou[0];
  $('#unDesc').textContent = achou[1];
  $$('#opcoes button').forEach(function(x){ x.classList.toggle('sel', x.dataset.un === un); });
}

function abrirUnidades(abrir){
  var s = $('#seletor');
  s.classList.toggle('aberto', abrir);
  if(!abrir) return;

  var alt = $('#opcoes').offsetHeight;
  s.style.setProperty('--alturaLista', (alt + 12) + 'px');

  var sel = $('#opcoes button.sel');
  if(sel) $('#opcoes').scrollTop = Math.max(0, sel.offsetTop - 70);

  // em tela pequena o botão sai da área visível — rola até ele aparecer
  setTimeout(function(){
    var b = $('#btnGerar').getBoundingClientRect();
    var sobra = b.bottom - window.innerHeight + 16;
    if(sobra > 0) window.scrollBy({ top: sobra, behavior: 'smooth' });
  }, 40);
}

$('#unidadeBt').addEventListener('click', function(e){
  e.stopPropagation();
  abrirUnidades(!$('#seletor').classList.contains('aberto'));
});

$('#opcoes').addEventListener('click', function(e){
  var b = e.target.closest('[data-un]');
  if(!b) return;
  definirUnidade(b.dataset.un);
  abrirUnidades(false);
});

document.addEventListener('click', function(e){
  if(!e.target.closest('#seletor')) abrirUnidades(false);
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') abrirUnidades(false);
});

/* ---------- máscara de preço ---------- */
/* Vírgula fixa em duas casas: os dígitos entram pela direita.
   100 -> 1,00   ·   199 -> 1,99   ·   1250 -> 12,50 */
function aplicarMascara(){
  var el = $('#preco');
  var digitos = el.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 9);
  if(!digitos){ el.value = ''; return; }
  while(digitos.length < 3) digitos = '0' + digitos;
  var reais = parseInt(digitos.slice(0, -2), 10);
  el.value = reais.toLocaleString('pt-BR') + ',' + digitos.slice(-2);
}

$('#preco').addEventListener('input', aplicarMascara);

/* ---------- criar ---------- */
$('#produto').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); $('#variacao').focus(); }
});
$('#variacao').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); $('#preco').focus(); }
});
$('#preco').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); gerar(); }
});
$('#btnGerar').addEventListener('click', gerar);

function gerar(){
  var produto = $('#produto').value.trim();
  var variacao = $('#variacao').value.trim();
  var preco = paraNumero($('#preco').value);

  if(!produto){ toast('Falta o nome do produto','erro'); $('#produto').focus(); return; }
  if(preco === null){ toast('Falta o preço','erro'); $('#preco').focus(); return; }

  placas.unshift({
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    loja: lojaSel,
    produto: produto,
    variacao: variacao,
    preco: preco,
    unidade: unidadeSel,
    enviada: false,
    criadaEm: new Date().toISOString()
  });
  salvar();
  render();

  $('#produto').value = '';
  $('#variacao').value = '';
  $('#preco').value = '';
  definirUnidade('UN');
  $('#produto').focus();
  toast('Placa gerada');
}

/* ---------- lista ---------- */
function render(){
  var pendentes = placas.filter(function(p){ return !p.enviada; });
  var enviadas = placas.filter(function(p){ return p.enviada; });

  var selo = $('#selo');
  selo.textContent = pendentes.length;
  selo.classList.toggle('oculto', pendentes.length === 0);

  $('#acoes').classList.toggle('oculto', placas.length === 0);
  $('#btnEnviar').disabled = pendentes.length === 0;
  $('#btnEnviar').textContent = pendentes.length
    ? 'Enviar ' + pendentes.length + (pendentes.length === 1 ? ' placa' : ' placas')
    : 'Nada a enviar';
  $('#btnLimpar').disabled = enviadas.length === 0;

  if(!placas.length){
    $('#lista').innerHTML =
      '<div class="vazio"><strong>Nenhuma placa</strong>' +
      '<span>As que tu criar aparecem aqui.</span></div>';
    return;
  }

  var html = '';
  if(pendentes.length){
    html += '<div class="titulo">A enviar <em>' + pendentes.length + '</em></div>' +
            pendentes.map(itemHTML).join('');
  }
  if(enviadas.length){
    html += '<div class="titulo">Enviadas <em>' + enviadas.length + '</em></div>' +
            enviadas.map(itemHTML).join('');
  }
  $('#lista').innerHTML = html;
}

function itemHTML(p){
  return '<div class="item' + (p.enviada ? ' enviada' : '') + '">' +
    '<div class="txt">' +
      '<div class="nome">' + esc(p.produto) +
        (p.variacao ? ' <span style="color:var(--suave);font-weight:500">· ' + esc(p.variacao) + '</span>' : '') +
      '</div>' +
      '<div class="un"><span class="loja">' + esc(p.loja || 'MATRIZ') + '</span>' +
        esc(p.unidade) + (p.enviada ? ' · enviada' : '') + '</div>' +
    '</div>' +
    '<div class="preco">' + fmt(p.preco) + '</div>' +
    '<button class="lixo" data-del="' + p.id + '">&times;</button>' +
  '</div>';
}

$('#lista').addEventListener('click', function(e){
  var b = e.target.closest('[data-del]');
  if(!b) return;
  placas = placas.filter(function(p){ return p.id !== b.dataset.del; });
  salvar();
  render();
});

/* ---------- enviar / limpar ---------- */
$('#btnEnviar').addEventListener('click', function(){
  var pendentes = placas.filter(function(p){ return !p.enviada; });
  if(!pendentes.length) return;
  if(!window.__enviarPlaca){ toast('Ainda carregando, tenta de novo', 'erro'); return; }

  var btn = $('#btnEnviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  var falhou = 0, feitas = 0;

  pendentes.forEach(function(p){
    window.__enviarPlaca(p).then(function(){
      p.enviada = true;
      p.enviadaEm = new Date().toISOString();
    }).catch(function(e){
      console.error(e); falhou++;
    }).then(function(){
      if(++feitas < pendentes.length) return;
      salvar(); render();
      if(falhou) toast(falhou + ' não foram, tenta de novo', 'erro');
      else toast(pendentes.length + (pendentes.length === 1 ? ' placa enviada' : ' placas enviadas'), 'ok');
    });
  });

  // sem sinal, o Firestore só confirma quando a rede voltar:
  // libera a lista na hora e sincroniza sozinho depois
  setTimeout(function(){
    if(!btn.disabled) return;
    pendentes.forEach(function(p){
      if(!p.enviada){ p.enviada = true; p.enviadaEm = new Date().toISOString(); }
    });
    salvar(); render();
    toast('Sem sinal — vai sozinho quando voltar');
  }, 2500);
});

$('#btnLimpar').addEventListener('click', function(){
  var enviadas = placas.filter(function(p){ return p.enviada; }).length;
  if(!enviadas) return;
  if(!confirm('Apagar ' + enviadas + (enviadas === 1 ? ' placa já enviada?' : ' placas já enviadas?'))) return;
  placas = placas.filter(function(p){ return !p.enviada; });
  salvar();
  render();
  toast('Lista limpa');
});

$('#btnApagarTudo').addEventListener('click', function(){
  if(!placas.length) return;
  if(!confirm('Apagar TODAS as ' + placas.length + ' placas, inclusive as que ainda não foram enviadas?')) return;
  placas = [];
  salvar();
  render();
  toast('Tudo apagado');
});

/* ---------- início ---------- */
carregar();
var salva = null;
try { salva = localStorage.getItem(CHAVE_LOJA); } catch(e){}
definirLoja(LOJAS.indexOf(salva) >= 0 ? salva : 'MATRIZ');
definirUnidade('UN');
render();

})();
</script>
</body>
</html>
